name: flightdeck_server
description: O flightdeck-server (plano 58) — binário Dart headless que serve o motor do FlightDeck via protocolo JSONL sobre socket local.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  auto_injector: ^2.0.0
  flightdeck_core:
    path: ../flightdeck_core
  flightdeck_engine:
    path: ../flightdeck_engine
  flightdeck_protocol:
    path: ../flightdeck_protocol
  # Deps diretas dos drivers de DB: o `dart compile exe` só empacota os native
  # assets das dependências DIRETAS do pacote raiz — via flightdeck_engine
  # (transitivo) os dylibs do anaki ficavam de fora ("No available native
  # assets"). Declarar aqui força o bundle no binário do servidor.
  anaki_sqlite: ^0.1.4
  anaki_postgres: ^0.1.5
  anaki_mysql: ^0.1.7
  anaki_mssql: ^0.1.4
  anaki_redis: ^0.1.4
  anaki_mongodb: ^0.1.7
  meta: ^1.19.0

dev_dependencies:
  fake_async: ^1.3.1
  test: ^1.25.0

executables:
  flightdeck_server: flightdeck_server
